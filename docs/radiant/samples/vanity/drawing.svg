<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="930" viewBox="0 0 1320 930">
<title>公卫浴室柜 · 自拟设计图 V01</title>
<desc>毫米制正立面、纵剖面与俯视图。柜体宽690、深500、台高850。石面嵌盆、两个抽面和下方开放格。</desc>
<defs>
  <pattern id="reed" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#c99868"/><path d="M3 0v16" stroke="#ac7b50" stroke-width="2"/></pattern>
  <style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#233e35}
    .label{font-size:18px;font-weight:600}.note{font-size:15px;fill:#52675e}.small{font-size:13px;fill:#52675e}
    .part{stroke:#4e574b;stroke-width:1.8}.wood{fill:#d2a67a}.rear{fill:#ae825b}.face{fill:url(#reed)}.stone{fill:#f1ecde}.metal{fill:#545b55}
    .dim path,.dim line{stroke:#66766c;stroke-width:1.3;fill:none}.dim text{font-size:23px;text-anchor:middle}.thin{stroke:#88958a;stroke-width:1;fill:none}
  </style>
</defs>
<rect width="1320" height="930" fill="#fbfaf4"/>
<path d="M48 98h1224M48 675h1224M48 880h1224" stroke="#b6bfb2"/>
<text x="48" y="53" font-size="31" font-weight="650">公卫浴室柜</text><text x="49" y="81" class="note">自拟设计图 · 台下盆 / 竖纹抽面 / 开放底格</text>
<text x="1272" y="54" text-anchor="end" font-size="22">V01</text><text x="1272" y="80" text-anchor="end" class="small">尺寸单位 mm</text>
<text x="78" y="139" class="label">正立面</text><text x="495" y="139" class="label">侧剖面</text><text x="895" y="139" class="label">俯视图</text>

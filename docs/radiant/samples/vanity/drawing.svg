</g>
<text x="897" y="506" class="note">台盆开口　400 × 260</text><text x="897" y="540" class="note">盆深　125</text><text x="897" y="574" class="note">龙头最高点　距地 990</text><text x="897" y="608" class="note">后边靠墙，抽面朝公卫内侧</text>
<text x="50" y="720" class="label">构造与表面</text>

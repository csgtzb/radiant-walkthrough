<rect x="680" y="746" width="32" height="32" fill="#535d56"/><text x="725" y="769" class="note">金属拉手，宽 128，台面内收纳凸出五金</text>
<text x="680" y="820" class="note">离地基座 75，开放底格净高 160，两抽面间缝 5</text>
<text x="50" y="907" class="small">Radiant 2C 公共卫生间 · 概念样件</text><text x="1270" y="907" class="small" text-anchor="end">自拟测试输入 · 仅用于建模验证</text>
</svg>

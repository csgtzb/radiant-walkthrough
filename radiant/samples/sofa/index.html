<script>
const reference=document.querySelector('#reference');
function useOriginal(){
  if(reference.dataset.tried){document.querySelector('#photo-error').hidden=false;reference.hidden=true;return;}
  reference.dataset.tried='true';
  reference.src='https://sixpenny.com/cdn/shop/files/neva-loveseat-washed-cotton-linen-corn-silk-lifestyle-PDP1-2_1200x1200.jpg';
}
reference.addEventListener('error',useOriginal);
if(reference.complete&&!reference.naturalWidth)useOriginal();
</script>
